<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Browse accessible summaries of research and projects from the Helix Centre, Imperial College London and the Royal College of Art." />
  <title>Publication Summaries | Helix Centre</title>
  <link rel="icon" href="helix-logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="table-embed">
  <div class="app-shell">
    <main class="page-content" aria-label="Publication table">
      <section class="table-card" aria-label="Publication summaries">
        <div class="table-intro">
          <p>Below you can explore plain English summaries of our published work. Click into any entry for the summary, or to read the full publication.</p>
        </div>

        <div class="table-card__header">
          <!-- TEMPORARILY HIDDEN. Delete the `hidden` attribute here and on
               #filters-panel below to bring the filters menu back; nothing
               else needs changing. The menu still builds itself and the
               filters still work from links and from clicks in the table. -->
          <button id="filters-toggle" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filters-panel" hidden>
            Filters
            <span id="filters-count" class="filters-toggle__count" hidden>0</span>
            <span class="filters-toggle__chevron" aria-hidden="true"></span>
          </button>

          <div class="table-actions">
            <label class="visually-hidden" for="search-input">Search summaries by title, author, project, theme or keyword</label>
            <input id="search-input" class="m3-input" type="search" placeholder="Search summaries" autocomplete="off" />
          </div>
        </div>

        <!-- TEMPORARILY HIDDEN — see the note on #filters-toggle above. This
             one carries `hidden` in normal use too; the script removes it when
             the button is pressed, so it also needs the button back. -->
        <div id="filters-panel" class="filters-panel" role="region" aria-label="Filters" hidden>
          <div id="filter-groups" class="filters-panel__groups"></div>
          <div class="filters-panel__footer">
            <span id="filter-summary" class="filters-panel__summary"></span>
            <button id="filters-clear" class="filters-panel__clear" type="button">Clear all</button>
            <button id="filters-done" class="filters-panel__done" type="button">Done</button>
          </div>
        </div>

        <div id="filter-bar" class="filter-bar" hidden></div>

        <div class="table-wrap">
          <table class="m3-table">
            <thead>
              <tr>
                <th><span class="visually-hidden">Image</span></th>
                <th>Title</th>
                <th>Theme &amp; project</th>
                <th>Publication details</th>
              </tr>
            </thead>
            <tbody id="submissions-body">
              <tr>
                <td colspan="4" class="loading-cell">Loading submissions...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <nav id="pager" class="pager" aria-label="Table pages" hidden></nav>
      </section>
    </main>
  </div>

  <script src="embed.js"></script>
  <script src="script.js"></script>
</body>
</html>
