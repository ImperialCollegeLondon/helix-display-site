<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Browse accessible summaries of research and projects from the Helix Centre, Imperial College London and the Royal College of Art." />
  <title>Publication Summaries | Helix Centre</title>
  <link rel="icon" href="helix-logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="table-embed">
  <div class="app-shell">
    <main class="page-content" aria-label="Publication table">
      <section class="table-card" aria-label="Publication summaries">
        <div class="table-card__header">
          <div class="table-actions">
            <label class="visually-hidden" for="search-input">Search summaries by title, author, project, theme or keyword</label>
            <input id="search-input" class="m3-input" type="search" placeholder="Search summaries" autocomplete="off" />
          </div>
        </div>

        <div id="filter-bar" class="filter-bar" hidden></div>

        <div class="table-wrap">
          <table class="m3-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Theme</th>
                <th>Project</th>
                <th>Publication Date</th>
              </tr>
            </thead>
            <tbody id="submissions-body">
              <tr>
                <td colspan="4" class="loading-cell">Loading submissions...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <nav id="pager" class="pager" aria-label="Table pages" hidden></nav>
      </section>
    </main>
  </div>

  <script src="embed.js"></script>
  <script src="script.js"></script>
</body>
</html>
