name: Update submissions

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-submissions
  cancel-in-progress: true

env:
  # Who gets notified if the sync breaks. GitHub emails issue assignees, so
  # this needs to be a GitHub username with access to the repository.
  ALERT_ASSIGNEE: victoria-simpson-ic

jobs:
  update-submissions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site data from Qualtrics
        env:
          QUALTRICS_API_TOKEN: ${{ secrets.QUALTRICS_API_TOKEN }}
          QUALTRICS_DATA_CENTER: ${{ secrets.QUALTRICS_DATA_CENTER }}
          QUALTRICS_SURVEY_ID: ${{ secrets.QUALTRICS_SURVEY_ID }}
        run: python scripts/build_site_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/submissions.json data/refs.json images/
          git diff --cached --quiet && exit 0
          git commit -m "Update submissions"
          git pull --rebase --strategy-option=theirs origin main
          git push origin HEAD:main

      # If anything above fails, the site quietly keeps serving old data, so
      # raise an issue. GitHub emails the assignee. One issue is reused while
      # the problem persists rather than one per failed run (every 15 minutes).
      - name: Raise an alert if the sync failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "sync-failure";
            const title = "Publication Summaries sync is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Make sure the label exists (ignore "already exists").
            try {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: "d0006f",
                description: "The Qualtrics sync failed"
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: label
            });

            const body = [
              "The **Update submissions** workflow failed, so the site is still showing the data from the last successful run.",
              "",
              `Failed run: ${runUrl}`,
              `Time: ${new Date().toUTCString()}`,
              "",
              "Common causes:",
              "- the Qualtrics API token has expired or been rotated",
              "- `QUALTRICS_SURVEY_ID` points at the wrong survey",
              "- a survey question was reworded, so a column could not be matched (the run log shows `WARNING: could not resolve columns for:`)",
              "- the export came back empty and the build refused to publish an empty table",
              "",
              "Open the failed run above and read the failing step. This issue will close itself once a run succeeds."
            ].join("\n");

            if (existing.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.data[0].number,
                body: `Still failing.\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: [label],
                assignees: process.env.ALERT_ASSIGNEE ? [process.env.ALERT_ASSIGNEE] : []
              });
            }

      # Close the alert automatically once things are working again.
      - name: Resolve the alert after a successful run
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "sync-failure";
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: label
            });

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: "The sync completed successfully, so this is resolved."
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: "closed"
              });
            }
